document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

002Fdiv>\n  <div>每个数字旁的日期为该数据的最新观测日。日度市场数据为上一交易日收盘；月度、季度宏观数据随官方发布更新。黄金以 PAXG（1 枚对应 1 盎司伦敦金）报价代理。<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;colorConvention&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;west&quot;,&quot;cn&quot;],&quot;default&quot;:&quot;west&quot;,&quot;tsType&quot;:&quot;'west'|'cn'&quot;,&quot;section&quot;:&quot;显示&quot;},&quot;showSparklines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;显示&quot;},&quot;refreshMinutes&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[15,30,60,120],&quot;default&quot;:60,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;数据&quot;},&quot;dataUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://raw.githubusercontent.com/zrx26893-cmd/hello-github/main/data/fred.json&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;数据&quot;}}\">\nconst DAY = 864e5;\nconst SERIES = {\n  SP500:'d',NASDAQCOM:'d',DTWEXBGS:'d',DCOILBRENTEU:'d',VIXCLS:'d',\n  DGS3MO:'d',DGS2:'d',DGS10:'d',DGS30:'d',T10Y2Y:'d',T10Y3M:'d',DFII10:'d',T10YIE:'d',\n  DFEDTARU:'d',DFEDTARL:'d',EFFR:'d',BAMLH0A0HYM2:'d',BAMLC0A0CM:'d',\n  WALCL:'w',ICSA:'w',NFCI:'w',MORTGAGE30US:'w',\n  CPIAUCSL:'m',CPILFESL:'m',PCEPILFE:'m',PPIFIS:'m',UNRATE:'m',PAYEMS:'m',INDPRO:'m',RSAFS:'m',UMCSENT:'m',M2SL:'m',\n  A191RL1Q225SBEA:'q'\n};\nconst BACK = { d: 800, w: 1150, m: 2650, q: 2650 };\nconst MEET = [['01-27','01-28'],['03-17','03-18',1],['04-28','04-29'],['06-16','06-17',1],['07-28','07-29'],['09-15','09-16',1],['10-27','10-28'],['12-08','12-09',1]];\nconst PROXIES = [u=>u, u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)];\nconst DBN = { DGS3MO:'RIFLGFCM03_N.B', DGS2:'RIFLGFCY02_N.B', DGS10:'RIFLGFCY10_N.B', DGS30:'RIFLGFCY30_N.B', EFFR:'RIFSPFF_N.B', DFII10:'RIFLGFCY10_XII_N.B' };\nconst DERIVED = { T10Y2Y:['DGS10','DGS2'], T10Y3M:['DGS10','DGS3MO'], T10YIE:['DGS10','DFII10'] };\nconst CACHE_KEY = 'macro-dash-cache-v1';\nconst h = React.createElement;\n\nconst fmt = (v,dp) => v==null||!isFinite(v) ? '—' : Number(v).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});\nconst pad2 = n => String(n).padStart(2,'0');\nconst fmtD = t => { const d=new Date(t); return d.getUTCFullYear()+'/'+pad2(d.getUTCMonth()+1)+'/'+pad2(d.getUTCDate()); };\nconst ym = t => new Date(t).toISOString().slice(0,7);\nconst ymBack = (t,n) => { const d=new Date(t); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()-n); return ym(d.getTime()); };\nconst mLab = t => { const d=new Date(t); return d.getUTCFullYear()+' 年 '+(d.getUTCMonth()+1)+' 月'; };\nconst qLab = t => { const d=new Date(t); return d.getUTCFullYear()+' Q'+(Math.floor(d.getUTCMonth()/3)+1); };\nconst at = (a,t) => { let r=null; for (const p of a) { if (p[0]<=t) r=p; else break; } return r; };\nconst parseCSV = t => t.trim().split(/\\r?\\n/).slice(1).map(l=>{ const [d,v]=l.split(','); return [Date.parse(d+'T00:00:00Z'), parseFloat(v)]; }).filter(p=>isFinite(p[0])&&isFinite(p[1]));\nconst yoy = a => { const m=new Map(a.map(p=>[ym(p[0]),p[1]])); return a.map(p=>{ const b=m.get(ymBack(p[0],12)); return b ? [p[0],(p[1]/b-1)*100] : null; }).filter(Boolean); };\nconst mdiff = (a,pct) => { const m=new Map(a.map(p=>[ym(p[0]),p[1]])); return a.map(p=>{ const b=m.get(ymBack(p[0],1)); return b!=null ? [p[0], pct?(p[1]/b-1)*100:p[1]-b] : null; }).filter(Boolean); };\n\nfunction niceTicks(lo,hi,n){ const raw=(hi-lo||1)/n, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p; const st=(m<1.5?1:m<3?2:m<7?5:10)*p; const out=[]; for(let v=Math.ceil(lo/st)*st; v<=hi+1e-9; v+=st) out.push(+v.toFixed(10)); return {out,st}; }\nconst tickFmt = (v,st) => { const dp = st>=1?0:Math.min(3,Math.ceil(-Math.log10(st)-1e-9)); return fmt(v,dp); };\n\nfunction chart(series, o){\n  o=o||{}; series=series.filter(s=>s.pts&&s.pts.length>1); if(!series.length) return null;\n  const W=640, H=o.h||230, pl=46, pr=o.bars?14:(o.pr||80), pt=12, pb=28;\n  let t0=Infinity,t1=-Infinity,lo=Infinity,hi=-Infinity;\n  for(const s of series) for(const p of s.pts){ if(p[0]<t0)t0=p[0]; if(p[0]>t1)t1=p[0]; if(p[1]<lo)lo=p[1]; if(p[1]>hi)hi=p[1]; }\n  (o.refs||[]).forEach(r=>{ lo=Math.min(lo,r.v); hi=Math.max(hi,r.v); });\n  if(o.bars){ lo=Math.min(lo,0); hi=Math.max(hi,0); }\n  const padv=(hi-lo)*0.08||1; lo-=padv; hi+=padv;\n  const inset = o.bars ? (W-pl-pr)/(series[0].pts.length)/2 : 0;\n  const X=t=>pl+inset+(t-t0)/((t1-t0)||1)*(W-pl-pr-inset*2), Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);\n  const k=[]; const {out,st}=niceTicks(lo,hi,4);\n  out.forEach((v,i)=>{ k.push(h('line',{key:'g'+i,x1:pl,x2:W-pr,y1:Y(v),y2:Y(v),stroke:'#2a2a2a'})); k.push(h('text',{key:'gt'+i,x:pl-8,y:Y(v)+4,textAnchor:'end',fontSize:11,fill:'#777'},tickFmt(v,st))); });\n  const span=t1-t0, xf = span<200*DAY ? (t=>{const d=new Date(t);return (d.getUTCMonth()+1)+'/'+d.getUTCDate();}) : (t=>{const d=new Date(t);return String(d.getUTCFullYear()).slice(2)+'年'+(d.getUTCMonth()+1)+'月';});\n  for(let i=0;i<5;i++){ const t=t0+span*i/4; k.push(h('text',{key:'x'+i,x:X(t),y:H-8,textAnchor:i===0?'start':i===4?'end':'middle',fontSize:11,fill:'#777'},xf(t))); }\n  (o.refs||[]).forEach((r,i)=>{ k.push(h('line',{key:'r'+i,x1:pl,x2:W-pr,y1:Y(r.v),y2:Y(r.v),stroke:'#5c5c5c',strokeDasharray:'4 4'})); if(r.label) k.push(h('text',{key:'rt'+i,x:pl+6,y:Y(r.v)-5,fontSize:11,fill:'#888'},r.label)); });\n  const ends=[];\n  series.forEach((s,si)=>{\n    if(o.bars){ const n=s.pts.length, bw=Math.max(1.5,(W-pl-pr)/n*0.68);\n      s.pts.forEach((p,i)=>{ const y0=Y(0), y1=Y(p[1]); k.push(h('rect',{key:'b'+si+'_'+i,x:X(p[0])-bw/2,y:Math.min(y0,y1),width:bw,height:Math.max(1,Math.abs(y1-y0)),fill:p[1]>=0?o.up:o.down,rx:1.5})); });\n    } else {\n      const d=s.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');\n      k.push(h('path',{key:'p'+si,d,fill:'none',stroke:s.color,strokeWidth:1.6,strokeLinejoin:'round'}));\n      const l=s.pts[s.pts.length-1]; ends.push({x:X(l[0])+6,y:Y(l[1])+4,c:s.color,t:(s.label?s.label+' ':'')+(s.fmt?s.fmt(l[1]):fmt(l[1],2))});\n    }\n  });\n  ends.sort((a,b)=>a.y-b.y); for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<13) ends[i].y=ends[i-1].y+13;\n  ends.forEach((e,i)=>k.push(h('text',{key:'e'+i,x:e.x,y:e.y,fontSize:11,fill:e.c},e.t)));\n  return h('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:{display:'block',overflow:'visible'}},k);\n}\nfunction spark(pts,color){\n  if(!pts||pts.length<2) return null;\n  const W=240,H=34; let lo=Infinity,hi=-Infinity; pts.forEach(p=>{lo=Math.min(lo,p[1]);hi=Math.max(hi,p[1]);});\n  const t0=pts[0][0], t1=pts[pts.length-1][0];\n  const d=pts.map((p,i)=>(i?'L':'M')+((p[0]-t0)/((t1-t0)||1)*W).toFixed(1)+' '+(2+(hi-p[1])/((hi-lo)||1)*(H-4)).toFixed(1)).join('');\n  return h('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H,preserveAspectRatio:'none',style:{display:'block'}},h('path',{d,fill:'none',stroke:color,strokeWidth:1.4,vectorEffect:'non-scaling-stroke',opacity:0.85}));\n}\n\nclass Component extends DCLogic {\n  state = { data:{}, err:{}, btc:[], gold:[], fng:[], updatedAt:null, loading:false, now:Date.now() };\n  px = {};\n\n  componentDidMount(){\n    try { const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); if(c) this.setState({data:c.data||{},btc:c.btc||[],gold:c.gold||[],fng:c.fng||[],updatedAt:c.updatedAt}); } catch(e){}\n    this.refresh(); this.startTimer();\n    this.clock=setInterval(()=>this.setState({now:Date.now()}),30000);\n  }\n  componentDidUpdate(prev){ if(prev.refreshMinutes!==this.props.refreshMinutes) this.startTimer(); }\n  componentWillUnmount(){ clearInterval(this.timer); clearInterval(this.clock); }\n  startTimer(){ clearInterval(this.timer); const m=Math.max(5,Number(this.props.refreshMinutes??60)); this.timer=setInterval(()=>this.refresh(),m*60000); }\n\n  async fetchText(url, ok, key){\n    const start=this.px[key]||0; let last;\n    for(let n=0;n<PROXIES.length;n++){\n      const i=(start+n)%PROXIES.length;\n      try {\n        const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),i===0?6000:10000);\n        const r=await fetch(PROXIES[i](url),{signal:ctl.signal}); clearTimeout(to);\n        if(!r.ok) throw new Error('HTTP '+r.status);\n        const t=await r.text(); if(ok && !ok(t)) throw new Error('bad payload');\n        this.px[key]=i; return t;\n      } catch(e){ last=e; }\n    }\n    throw last;\n  }\n\n  async refresh(){\n    if(this.busy) return; this.busy=true; this.setState({loading:true});\n    const iso=t=>new Date(t).toISOString().slice(0,10);\n    const data={...this.state.data}, err={}; let qi=0, fails=0, oks=0, ghAt=null;\n    try {\n      const url=(this.props.dataUrl||'https://raw.githubusercontent.com/zrx26893-cmd/hello-github/main/data/fred.json')+'?t='+Math.floor(Date.now()/3e5);\n      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),10000);\n      const j=await (await fetch(url,{signal:ctl.signal})).json(); clearTimeout(to);\n      for(const id in j.series) data[id]=j.series[id].map(p=>[Date.parse(p[0]+'T00:00:00Z'),p[1]]);\n      ghAt=Date.parse(j.updated); this.setState({data:{...data},ghAt});\n    } catch(e){}\n    const have=id=>ghAt&&data[id]&&data[id].length;\n    const ids=Object.keys(SERIES).filter(id=>!DBN[id]&&!DERIVED[id]&&!have(id));\n    const dbn=Object.keys(DBN).filter(id=>!have(id)).map(async id=>{ try {\n        const j=await (await fetch(`https://api.db.nomics.world/v22/series/FED/H15/${DBN[id]}?observations=1&format=json`)).json();\n        const d=j.series.docs[0], t0=Date.now()-BACK.d*DAY;\n        data[id]=d.period.map((p,i)=>[Date.parse(p+'T00:00:00Z'),parseFloat(d.value[i])]).filter(p=>p[0]>=t0&&isFinite(p[1]));\n        this.setState({data:{...data}});\n      } catch(e){ err[id]=true; } });\n    const dbnDone=Promise.all(dbn).then(()=>{ for(const id in DERIVED){ if(have(id)) continue; const [a,b]=DERIVED[id]; if(!data[a]||!data[b]){ err[id]=true; continue; } const m=new Map(data[b].map(p=>[p[0],p[1]])); data[id]=data[a].filter(p=>m.has(p[0])).map(p=>[p[0],+(p[1]-m.get(p[0])).toFixed(3)]); } this.setState({data:{...data}}); });\n    const worker=async()=>{ while(qi<ids.length){ const id=ids[qi++];\n      if(fails>=4&&oks===0){ err[id]=true; continue; }\n      try {\n        const url=`https://fred.stlouisfed.org/graph/fredgraph.csv?id=${id}&cosd=${iso(Date.now()-BACK[SERIES[id]]*DAY)}`;\n        const rows=parseCSV(await this.fetchText(url,s=>/^\\s*(observation_date|DATE)/i.test(s),'fred'));\n        if(!rows.length) throw new Error('empty'); data[id]=rows; oks++; this.setState({data:{...data}});\n      } catch(e){ err[id]=true; fails++; }\n    }};\n    const isJson=s=>/^\\s*[\\[{]/.test(s);\n    const cg=async(coin,key)=>{ try { const j=JSON.parse(await this.fetchText(`https://api.coingecko.com/api/v3/coins/${coin}/market_chart?vs_currency=usd&days=365&interval=daily`,isJson,'cg')); if(j.prices&&j.prices.length) this.setState({[key]:j.prices}); else err[key]=true; } catch(e){ err[key]=true; } };\n    const fng=async()=>{ try { const j=JSON.parse(await this.fetchText('https://api.alternative.me/fng/?limit=90',isJson,'fng')); this.setState({fng:j.data.map(d=>[Number(d.timestamp)*1000,Number(d.value),d.value_classification]).reverse()}); } catch(e){ err.fng=true; } };\n    await Promise.all([...Array(4)].map(worker), dbnDone, cg('bitcoin','btc').then(()=>cg('pax-gold','gold')), fng());\n    const updatedAt=Date.now();\n    this.setState({err,updatedAt,loading:false,now:updatedAt});\n    try { const s=this.state; localStorage.setItem(CACHE_KEY,JSON.stringify({data:s.data,btc:s.btc,gold:s.gold,fng:s.fng,updatedAt})); } catch(e){}\n    this.busy=false;\n    clearTimeout(this.doneT); this.doneT=setTimeout(()=>this.setState({now:Date.now()}),4100);\n  }\n\n  renderVals(){\n    const st=this.state, D=st.data, now=st.now;\n    const cn=(this.props.colorConvention??'west')==='cn', showSpark=this.props.showSparklines??true;\n    const UP=cn?'#f07178':'#3fb950', DN=cn?'#3fb950':'#f07178', MU='#9a9a9a', WH='#f2f2f2';\n    const BL='#4a90e2', OR='#e8743b', GY='#a8a8a8', AM='#e0a32e';\n    const col=v=>v==null||!isFinite(v)||Math.abs(v)<1e-9?MU:v>0?UP:DN;\n    const S=id=>D[id]||[], L=a=>a&&a.length?a[a.length-1]:null;\n    const sgn=(v,dp,u)=>v==null||!isFinite(v)?'—':(v>0?'+':'')+fmt(v,dp)+(u||'');\n    const chg=(a,days,pct)=>{ const l=L(a); if(!l) return null; const tg=l[0]-days*DAY; let p=at(a,tg); if(!p&&a[0][0]-tg<7*DAY) p=a[0]; if(!p||p===l) return null; return pct?(l[1]/p[1]-1)*100:l[1]-p[1]; };\n    const tail=(a,days)=>{ const l=L(a); return l?a.filter(p=>p[0]>=l[0]-days*DAY):[]; };\n    const loading=st.loading, emptyText=loading?'加载中…':(st.ghAt?'暂无数据':'等待 GitHub 数据任务启用');\n    const tvCfg=s=>'https://s.tradingview.com/embed-widget/mini-symbol-overview/?locale=zh_CN#'+encodeURIComponent(JSON.stringify({symbol:s,width:'100%',height:'100%',locale:'zh_CN',dateRange:'12M',colorTheme:'dark',isTransparent:true,autosize:true,largeChartUrl:'',chartOnly:false,noTimeScale:false}));\n    const tv=[['标普 500','FOREXCOM:SPXUSD'],['纳斯达克 100','FOREXCOM:NSXUSD'],['美元指数 DXY','TVC:DXY'],['美债 10 年期','TVC:US10Y'],['美债 2 年期','TVC:US02Y'],['布伦特原油','TVC:UKOIL'],['黄金','TVC:GOLD'],['比特币','BITSTAMP:BTCUSD']].map(([name,s])=>({name,src:tvCfg(s)}));\n\n    const card=(label,a,dp,unit,o)=>{ o=o||{}; const l=L(a), k=o.k||1;\n      const m=chg(a,30,o.pct), y=chg(a,365,o.pct); const cu=o.cu??(o.pct?'%':' 个百分点'), cdp=o.cdp??2, ck=o.pct?1:(o.cm??k);\n      return { label, date:l?'截至 '+fmtD(l[0]):'', value:l?fmt(l[1]*k,dp):'—', vc:WH, unit,\n        lines:[{k:'近一月',v:sgn(m==null?null:m*ck,cdp,cu),c:col(m)},{k:'近一年',v:sgn(y==null?null:y*ck,cdp,cu),c:col(y)}],\n        note:typeof o.note==='function'?(l?o.note(l[1]):''):(o.note||''), spark:showSpark?spark(tail(a,365),col(y)):null };\n    };\n    const mcard=(label,a,dp,unit,o)=>{ o=o||{}; const n=a.length, l=a[n-1], p=a[n-2]; const lag=o.q?3:12;\n      const y=l?a.find(q=>ym(q[0])===ymBack(l[0],lag)):null; const d=l&&p?l[1]-p[1]:null;\n      return { label, date:l?(o.q?qLab:mLab)(l[0]):'', value:l?fmt(l[1],dp):'—', vc:WH, unit,\n        lines:[{k:'前值 '+(p?fmt(p[1],dp)+unit:'—')+' · 变化',v:sgn(d,dp),c:col(d)},{k:(o.q?'上季':'一年前')+' '+(y?fmt(y[1],dp)+unit:'—'),v:'',c:MU}],\n        note:o.note||'', spark:showSpark?spark(a.slice(-36),GY):null };\n    };\n    const C=(title,sub,el)=>({title,sub,el,empty:!el,emptyText});\n\n    // derived\n    const cpiY=yoy(S('CPIAUCSL')), coreY=yoy(S('CPILFESL')), pceY=yoy(S('PCEPILFE')), ppiY=yoy(S('PPIFIS'));\n    const cpiM=mdiff(S('CPIAUCSL'),true), nfp=mdiff(S('PAYEMS')), ipY=yoy(S('INDPRO')), rsY=yoy(S('RSAFS')), m2Y=yoy(S('M2SL'));\n    const btc=st.btc||[], gold=st.gold||[], fng=st.fng||[];\n    const idx=a=>{ if(!a.length) return []; const b=a[0][1]; return a.map(p=>[p[0],p[1]/b*100]); };\n\n    const market={ title:'市场价格', sub:'最新收盘与近一月 / 近一年变化',\n      cards:[ card('标普 500',S('SP500'),2,'点',{pct:1}), card('纳斯达克综合',S('NASDAQCOM'),2,'点',{pct:1}), card('美元指数（广义）',S('DTWEXBGS'),2,'',{pct:1,note:'美联储贸易加权，2006 年 1 月 = 100'}),\n        card('布伦特原油',S('DCOILBRENTEU'),2,'美元/桶',{pct:1}), card('黄金（PAXG）',gold,2,'美元/盎司',{pct:1}), card('比特币 BTC',btc,0,'美元',{pct:1}) ],\n      charts:[ C('标普 500 · 近两年','日度收盘，FRED',chart([{pts:S('SP500'),color:BL,fmt:v=>fmt(v,0)}])),\n        C('比特币 vs 黄金 · 近一年','起点 = 100，CoinGecko 日度',chart([{pts:idx(btc),color:AM,label:'BTC',fmt:v=>fmt(v,0)},{pts:idx(gold),color:GY,label:'黄金',fmt:v=>fmt(v,0)}],{refs:[{v:100}]})) ] };\n\n    const rates={ title:'利率与收益率曲线', sub:'美国国债恒定期限收益率，日度',\n      cards:[ card('美债 3 个月',S('DGS3MO'),2,'%',{note:'反映短端政策预期'}), card('美债 2 年期',S('DGS2'),2,'%'), card('美债 10 年期',S('DGS10'),2,'%'), card('美债 30 年期',S('DGS30'),2,'%'),\n        card('10 年 − 2 年利差',S('T10Y2Y'),2,'个百分点',{note:v=>v>=0?'曲线正斜率，长端高于短端':'曲线倒挂，短端高于长端'}),\n        card('10 年期实际收益率',S('DFII10'),2,'%',{note:'TIPS 收益率'}), card('10 年通胀预期',S('T10YIE'),2,'%',{note:'盈亏平衡通胀率'}) ],\n      charts:[ C('收益率 · 近两年','3 个月 / 2 年 / 10 年 / 30 年，单位 %',chart([{pts:S('DGS3MO'),color:GY,label:'3M'},{pts:S('DGS2'),color:BL,label:'2Y'},{pts:S('DGS10'),color:OR,label:'10Y'},{pts:S('DGS30'),color:AM,label:'30Y'}])),\n        C('期限利差 · 近两年','单位个百分点，低于 0 为倒挂',chart([{pts:S('T10Y2Y'),color:BL,label:'10Y−2Y'},{pts:S('T10Y3M'),color:OR,label:'10Y−3M'}],{refs:[{v:0}]})),\n        C('实际收益率与通胀预期 · 近两年','10 年期 TIPS 与盈亏平衡通胀率，单位 %',chart([{pts:S('DFII10'),color:BL,label:'实际'},{pts:S('T10YIE'),color:OR,label:'通胀预期'}])) ] };\n\n    // Fed\n    const hiS=S('DFEDTARU'), loS=S('DFEDTARL'), hL=L(hiS), lL=L(loS);\n    const yr=new Date(now).getUTCFullYear()===2026?2026:2026;\n    const mt=MEET.map(m=>({s:Date.parse(yr+'-'+m[0]+'T00:00:00Z'),e:Date.parse(yr+'-'+m[1]+'T00:00:00Z'),sep:!!m[2],lab:m[0].replace('-','/').replace(/^0/,'').replace('/0','/')+'–'+m[1].slice(3).replace(/^0/,'')}));\n    const nextM=mt.find(m=>now<m.e+18*3600e3+60e3*30);\n    const rangeAt=t=>{ const a=at(loS,t), b=at(hiS,t); return a&&b?[a[1],b[1]]:null; };\n    const rows=mt.map(m=>{ const done=now>m.e+19*3600e3; const before=rangeAt(m.s-DAY), after=done&&hL&&hL[0]>=m.e+DAY?rangeAt(m.e+DAY):null;\n      const bp=before&&after?Math.round((after[1]-before[1])*100):null;\n      const note=!done?(m===nextM?'下次会议':'')+(m.sep?(m===nextM?' · ':'')+'含经济预测（点阵图）':''):bp==null?'':bp===0?'维持不变':bp>0?'加息 '+bp+' 基点':'降息 '+(-bp)+' 基点';\n      return [ {t:m.lab,c:'#e4e4e4',plain:true}, {t:done?'已公布':'待公布',c:done?'#cfcfcf':'#8a8a8a',chip:true,bg:done?'#222':'transparent'},\n        {t:bp==null?'':sgn(bp,0),c:col(bp),plain:true}, {t:after?fmt(after[0],2)+'–'+fmt(after[1],2)+'%':'',c:'#e4e4e4',plain:true}, {t:note,c:'#cfcfcf',plain:true} ]; });\n    const daysTo=nextM?Math.max(0,Math.ceil((nextM.s-now)/DAY)):null;\n    const walcl=S('WALCL');\n    const fed={ title:'美联储', sub:'政策利率、资产负债表与议息日程',\n      cards:[ { label:'联邦基金目标区间', date:hL?'截至 '+fmtD(hL[0]):'', value:hL&&lL?fmt(lL[1],2)+'–'+fmt(hL[1],2):'—', vc:WH, unit:'%',\n          lines:[{k:'近一年',v:sgn((chg(hiS,365)??NaN)*100,0,' 基点'),c:col(chg(hiS,365))}], note:'', spark:null },\n        card('有效联邦基金利率',S('EFFR'),2,'%',{cu:' 基点',cdp:0,cm:100,note:'EFFR'}),\n        { label:'下次议息会议', date:'', value:nextM?nextM.lab:'—', vc:WH, unit:'', lines:[{k:daysTo!=null?'距今 '+daysTo+' 天':'',v:'',c:MU}], note:'北京时间会议次日凌晨 2:00 公布决议'+(nextM&&nextM.sep?'，含点阵图':''), spark:null },\n        card('美联储总资产',walcl,2,'万亿美元',{pct:1,k:1e-6,note:'每周三更新'}) ],\n      charts:[ C('政策利率 vs 2 年期美债 · 近两年','2 年期低于政策利率通常意味着市场预期降息，单位 %',chart([{pts:S('EFFR'),color:GY,label:'EFFR'},{pts:S('DGS2'),color:BL,label:'2Y'}])),\n        C('美联储总资产 · 近三年','单位万亿美元，周度',chart([{pts:walcl.map(p=>[p[0],p[1]/1e6]),color:BL}])) ],\n      table:{ title:yr+' 年议息会议一览', sub:'决议后区间与变动根据 FRED 目标利率序列计算', cols:'1fr 1fr 0.8fr 1.3fr 2.4fr', head:['会议','状态','变动（基点）','决议后区间','说明'], rows } };\n\n    const infl={ title:'通胀', sub:'月度，季调；随 BLS / BEA 发布更新',\n      cards:[ mcard('CPI 同比',cpiY,1,'%'), mcard('核心 CPI 同比',coreY,1,'%',{note:'剔除食品与能源'}), mcard('核心 PCE 同比',pceY,1,'%',{note:'美联储首选通胀指标，目标 2%'}),\n        mcard('CPI 环比',cpiM,1,'%'), mcard('PPI 最终需求 同比',ppiY,1,'%') ],\n      charts:[ C('CPI / 核心 CPI / 核心 PCE 同比 · 近五年','单位 %，虚线为 2% 目标',chart([{pts:cpiY.slice(-60),color:OR,label:'CPI',fmt:v=>fmt(v,1)},{pts:coreY.slice(-60),color:BL,label:'核心',fmt:v=>fmt(v,1)},{pts:pceY.slice(-60),color:GY,label:'PCE',fmt:v=>fmt(v,1)}],{refs:[{v:2,label:'2% 目标'}]})),\n        C('CPI 环比 · 近 24 个月','单位 %，季调',chart([{pts:cpiM.slice(-24)}],{bars:1,up:UP,down:DN})) ] };\n\n    const gdp=S('A191RL1Q225SBEA');\n    const growth={ title:'增长与就业', sub:'劳动力市场、产出与消费',\n      cards:[ mcard('失业率',S('UNRATE'),1,'%'), mcard('非农新增就业',nfp,0,' 千人'), card('初请失业金人数',S('ICSA'),0,'千人',{k:1e-3,cu:' 千人',cdp:0,note:'周度'}),\n        mcard('实际 GDP 环比折年',gdp,1,'%',{q:1}), mcard('工业产出 同比',ipY,1,'%'), mcard('零售销售 同比',rsY,1,'%'), mcard('密歇根消费者信心',S('UMCSENT'),1,'') ],\n      charts:[ C('失业率 · 近五年','单位 %',chart([{pts:S('UNRATE').slice(-60),color:BL,fmt:v=>fmt(v,1)}])),\n        C('非农新增就业 · 近 24 个月','单位千人',chart([{pts:nfp.slice(-24)}],{bars:1,up:UP,down:DN})),\n        C('初请失业金 · 近三年','单位千人，周度',chart([{pts:S('ICSA').map(p=>[p[0],p[1]/1000]),color:OR,fmt:v=>fmt(v,0)}])),\n        C('实际 GDP 环比折年 · 近六年','单位 %，季度',chart([{pts:gdp.slice(-24)}],{bars:1,up:UP,down:DN})) ] };\n\n    const credit={ title:'信用、波动与流动性', sub:'风险偏好与金融条件',\n      cards:[ card('高收益债利差',S('BAMLH0A0HYM2'),2,'%',{note:'ICE 美银 HY OAS'}), card('投资级债利差',S('BAMLC0A0CM'),2,'%',{note:'ICE 美银 IG OAS'}),\n        card('VIX 波动率',S('VIXCLS'),2,'',{cu:' 点'}), card('芝加哥金融条件指数',S('NFCI'),2,'',{cu:'',note:'低于 0 表示金融条件偏宽松'}),\n        mcard('M2 货币供应 同比',m2Y,1,'%'), card('30 年期房贷利率',S('MORTGAGE30US'),2,'%',{note:'房地美，周度'}) ],\n      charts:[ C('信用利差 · 近两年','期权调整利差，单位 %',chart([{pts:S('BAMLH0A0HYM2'),color:OR,label:'HY'},{pts:S('BAMLC0A0CM'),color:BL,label:'IG'}])),\n        C('VIX · 近两年','虚线为 20',chart([{pts:S('VIXCLS'),color:AM,fmt:v=>fmt(v,1)}],{refs:[{v:20}]})),\n        C('M2 同比 · 近六年','单位 %',chart([{pts:m2Y.slice(-72),color:BL,fmt:v=>fmt(v,1)}],{refs:[{v:0}]})) ] };\n\n    const fL=L(fng), fPrev=fng.length>7?fng[fng.length-8]:null;\n    const fCls=v=>v<=24?'极度恐慌':v<=44?'恐慌':v<=55?'中性':v<=74?'贪婪':'极度贪婪';\n    const crypto={ title:'比特币情绪', sub:'alternative.me 每日读数',\n      cards:[ { label:'加密货币恐慌与贪婪指数', date:fL?'截至 '+fmtD(fL[0]):'', value:fL?String(fL[1]):'—', vc:WH, unit:fL?fCls(fL[1]):'', lines:[{k:'一周前',v:fPrev?fPrev[1]+' '+fCls(fPrev[1]):'—',c:MU}], note:'0 极度恐慌 · 100 极度贪婪', spark:null } ],\n      charts:[ C('恐慌与贪婪指数 · 近 90 天','50 为中性',chart([{pts:fng.map(p=>[p[0],p[1]]),color:AM,fmt:v=>fmt(v,0)}],{refs:[{v:75,label:'贪婪'},{v:25,label:'恐慌'}]})),\n        C('比特币价格 · 近一年','美元，日度',chart([{pts:btc,color:AM,fmt:v=>fmt(v,0)}])) ] };\n\n    // summary\n    const sp=chg(S('SP500'),30,true), t10=L(S('DGS10')), t10m=chg(S('DGS10'),30), sprd=L(S('T10Y2Y')), cL=L(cpiY), u=L(S('UNRATE')), hy=L(S('BAMLH0A0HYM2'));\n    const T=t=>({t,c:'#9a9a9a',w:400}), B=(t,c)=>({t,c:c||WH,w:500});\n    const bc=chg(btc,30,true);\n    const cl=[];\n    if(sp!=null) cl.push([T('标普 500 近一月 '),B(sgn(sp,2,'%'),col(sp))]);\n    if(t10) cl.push([T('10 年期美债 '),B(fmt(t10[1],2)+'%')].concat(t10m!=null?[T('（近一月 '),B(sgn(t10m,2),col(t10m)),T(' 个百分点）')]:[]));\n    if(sprd) cl.push([T('10 年 − 2 年利差 '),B(fmt(sprd[1],2))]);\n    if(cL) cl.push([T((new Date(cL[0]).getUTCMonth()+1)+' 月 CPI 同比 '),B(fmt(cL[1],1)+'%')]);\n    if(u) cl.push([T('失业率 '),B(fmt(u[1],1)+'%')]);\n    if(hy) cl.push([T('高收益债利差 '),B(fmt(hy[1],2)+'%')]);\n    if(bc!=null) cl.push([T('比特币近一月 '),B(sgn(bc,2,'%'),col(bc))]);\n    const summary = !cl.length ? [T(loading?'正在获取最新数据…':'暂未获取到数据，将自动重试。')] : cl.flatMap((c,i)=>i?[T('，')].concat(c):c).concat([T('。')]);\n\n    const total=Object.keys(SERIES).length+3, okN=Object.keys(SERIES).filter(id=>(D[id]||[]).length&&!st.err[id]).length+(btc.length&&!st.err.btc?1:0)+(gold.length&&!st.err.gold?1:0)+(fng.length&&!st.err.fng?1:0);\n    const tm=t=>{ const d=new Date(t); return pad2(d.getMonth()+1)+'/'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); };\n    const mins=Math.max(5,Number(this.props.refreshMinutes??60));\n    const statusText = loading ? '正在刷新…' : st.updatedAt ? `更新于 ${tm(st.updatedAt)}${st.ghAt?' · FRED 数据 '+tm(st.ghAt):''} · 每 ${mins} 分钟自动刷新 · 数据源 ${okN}/${total} 正常` : '尚未更新';\n    const statusDot = loading ? AM : okN===total ? '#3fb950' : okN>0 ? AM : '#f07178';\n\n    const justDone = !loading && st.updatedAt && now-st.updatedAt<4000;\n    const btnLabel = loading ? '刷新中…' : justDone ? '已刷新 ✓' : '立即刷新', btnOpacity = loading ? 0.6 : 1;\n    return { tv, summary, statusText, btnLabel, btnOpacity, statusDot, onRefresh:()=>this.refresh(), sections:[market,rates,fed,infl,growth,credit,crypto] };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
